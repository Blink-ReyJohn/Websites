<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Purchase Tracker — SCRUD (Improved UI + Charts)</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (optional) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    /* Mobile-first improvements */
    body { padding-bottom: 5rem; background: #f8f9fa; }
    .card-hover { transition: transform .14s, box-shadow .14s; }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .small-muted { font-size: .92rem; color: #6c757d; }
    .action-btns { display:flex; gap:.375rem; justify-content:flex-end; flex-wrap:wrap; }

    /* Responsive: show table on md+, cards on <md */
    #tableWrapper { display: none; }
    #cardWrapper { display: block; }

    @media(min-width: 768px){
      #tableWrapper { display:block; }
      #cardWrapper { display:none; }
    }

    /* Mobile card action buttons sticky bottom inside card */
    .purchase-card { position: relative; }
    .purchase-card .card-actions { position: static; margin-top: .5rem; }

    /* Tiny visual helpers */
    .muted-note { color:#6c757d; font-size:.92rem; }
    .chart-container { min-height: 240px; }
    .no-data { color:#6c757d; text-align:center; padding:2rem 1rem; border-radius:.5rem; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.03); }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">Purchase Tracker</a>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary" id="importBtn" aria-label="Import purchases"><i class="bi bi-upload"></i></button>
      <button class="btn btn-sm btn-outline-secondary" id="exportBtn" aria-label="Export purchases"><i class="bi bi-download"></i></button>
      <button class="btn btn-sm btn-primary" id="addBtn" aria-label="Add purchase"><i class="bi bi-plus-lg"></i> Add</button>
    </div>
  </div>
</nav>

<main class="container my-3">
  <div class="row g-3">

    <!-- Filters -->
    <div class="col-12">
      <div class="card p-2 card-hover">
        <div class="row gx-2 gy-2 align-items-center">
          <div class="col-12 col-md-4">
            <input id="searchText" type="search" class="form-control" placeholder="Search name, notes, category..." aria-label="Search purchases">
          </div>
          <div class="col-6 col-md-2">
            <input id="filterCategory" class="form-control" placeholder="Category" aria-label="Filter by category">
          </div>
          <div class="col-6 col-md-2">
            <input id="fromDate" type="date" class="form-control" aria-label="From date">
          </div>
          <div class="col-6 col-md-2">
            <input id="toDate" type="date" class="form-control" aria-label="To date">
          </div>
          <div class="col-6 col-md-2 text-end">
            <button id="clearFilters" class="btn btn-outline-secondary btn-sm">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Summary + Charts -->
    <div class="col-12">
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <div class="card p-3 card-hover">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <div class="small-muted">Summary</div>
                <div id="summaryCount" class="fs-5 fw-semibold">0 purchases</div>
                <div id="summaryTotal" class="fs-6 muted-note">Total ₱0.00</div>
              </div>
              <div>
                <select id="sortBy" class="form-select form-select-sm" aria-label="Sort purchases">
                  <option value="date_desc">Newest</option>
                  <option value="date_asc">Oldest</option>
                  <option value="amount_desc">Amount (High→Low)</option>
                  <option value="amount_asc">Amount (Low→High)</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-8">
          <div class="row g-3">
            <div class="col-6">
              <div class="card p-2 card-hover chart-container">
                <div class="card-body p-2">
                  <h6 class="card-title mb-2">By Category</h6>
                  <canvas id="categoryChart" aria-label="Category breakdown chart" role="img"></canvas>
                  <div id="categoryNoData" class="no-data d-none">No data to display</div>
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="card p-2 card-hover chart-container">
                <div class="card-body p-2">
                  <h6 class="card-title mb-2">Monthly Spend</h6>
                  <canvas id="monthlyChart" aria-label="Monthly spend chart" role="img"></canvas>
                  <div id="monthlyNoData" class="no-data d-none">No data to display</div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Data list: Table (desktop) -->
    <div class="col-12" id="tableWrapper">
      <div class="card p-2 card-hover">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light small-muted">
              <tr>
                <th>Item</th>
                <th class="text-end">Amount</th>
                <th style="width:120px;">Date</th>
                <th style="width:140px;">Category</th>
                <th style="width:160px;">Actions</th>
              </tr>
            </thead>
            <tbody id="purchasesTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Data list: Cards (mobile) -->
    <div class="col-12" id="cardWrapper">
      <div id="purchasesCards" class="d-grid gap-3"></div>
    </div>

  </div>
</main>

<!-- Add / Edit Modal -->
<div class="modal fade" id="purchaseModal" tabindex="-1" aria-labelledby="purchaseModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form id="purchaseForm" class="modal-content needs-validation" novalidate>
      <div class="modal-header">
        <h5 class="modal-title" id="purchaseModalLabel">Add Purchase</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input id="purchaseId" type="hidden">
        <div class="mb-2">
          <label class="form-label">Name</label>
          <input id="name" class="form-control" required aria-required="true">
          <div class="invalid-feedback">Name is required</div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label">Amount (₱)</label>
            <input id="amount" type="number" step="0.01" min="0" class="form-control" required>
            <div class="invalid-feedback">Enter a valid amount</div>
          </div>
          <div class="col-6">
            <label class="form-label">Date</label>
            <input id="date" type="date" class="form-control" required>
            <div class="invalid-feedback">Pick a date</div>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label">Category</label>
          <input id="category" class="form-control" placeholder="e.g., Groceries, Bills">
        </div>
        <div class="mb-2">
          <label class="form-label">Notes (optional)</label>
          <textarea id="notes" class="form-control" rows="2"></textarea>
        </div>
        <div class="form-check form-switch">
          <input id="recurring" class="form-check-input" type="checkbox">
          <label class="form-check-label">Recurring</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <p class="mb-0">Delete this purchase? This cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button id="cancelDelete" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button id="confirmDelete" type="button" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- Import choices modal -->
<div class="modal fade" id="importChoiceModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <p class="mb-2">How do you want to import the file?</p>
        <div class="d-grid gap-2">
          <button id="importReplaceBtn" class="btn btn-danger">Replace all purchases</button>
          <button id="importMergeBtn" class="btn btn-outline-primary">Merge with existing</button>
          <button id="importCancelBtn" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:1080">
  <div id="toastContainer" class="toast-container"></div>
</div>

<!-- Bootstrap JS & Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>

<script>
/* Purchase Tracker — v2 UI + Charts
   - SCRUD using localStorage (key: purchaseTracker.v2)
   - No sample data on first run
   - Mobile-first card UI with visible actions (no swipe required)
   - Charts: category doughnut and monthly spend line (Chart.js)
   - Toast notifications, debounced filters, safer DOM updates
*/

(() => {
  const STORAGE_KEY = 'purchaseTracker.v2';

  /* --------- Helpers --------- */
  const uid = () => Math.random().toString(36).slice(2,9);
  const currencyFormatter = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'PHP', minimumFractionDigits: 2 });
  const fmtMoney = n => isNaN(n) ? currencyFormatter.format(0) : currencyFormatter.format(Number(n));
  const escapeHtml = s => {
    if (!s) return '';
    return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  };
  function debounce(fn, wait=250){
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), wait);
    };
  }
  function showToast(message, opts = {}) {
    const { type = 'primary', autohide = true, delay = 3000 } = opts;
    const toastContainer = document.getElementById('toastContainer');
    const wrapper = document.createElement('div');
    wrapper.className = 'toast align-items-center text-bg-' + type + ' border-0';
    wrapper.role = 'status';
    wrapper.ariaLive = 'polite';
    wrapper.ariaAtomic = 'true';
    wrapper.innerHTML = `
      <div class="d-flex">
        <div class="toast-body">${escapeHtml(message)}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>`;
    toastContainer.appendChild(wrapper);
    const t = new bootstrap.Toast(wrapper, { autohide, delay });
    t.show();
    wrapper.addEventListener('hidden.bs.toast', () => wrapper.remove());
  }

  /* DOM elements */
  const purchasesTbody = document.getElementById('purchasesTbody');
  const purchasesCards = document.getElementById('purchasesCards');
  const summaryCount = document.getElementById('summaryCount');
  const summaryTotal = document.getElementById('summaryTotal');
  const searchText = document.getElementById('searchText');
  const filterCategory = document.getElementById('filterCategory');
  const fromDate = document.getElementById('fromDate');
  const toDate = document.getElementById('toDate');
  const sortBy = document.getElementById('sortBy');
  const clearFiltersBtn = document.getElementById('clearFilters');
  const addBtn = document.getElementById('addBtn');
  const importBtn = document.getElementById('importBtn');
  const exportBtn = document.getElementById('exportBtn');

  const purchaseModalEl = document.getElementById('purchaseModal');
  const purchaseModal = new bootstrap.Modal(purchaseModalEl);
  const purchaseForm = document.getElementById('purchaseForm');
  const modalTitle = document.getElementById('purchaseModalLabel');
  const purchaseId = document.getElementById('purchaseId');
  const nameInput = document.getElementById('name');
  const amountInput = document.getElementById('amount');
  const dateInput = document.getElementById('date');
  const categoryInput = document.getElementById('category');
  const notesInput = document.getElementById('notes');
  const recurringInput = document.getElementById('recurring');

  const confirmDeleteModalEl = document.getElementById('confirmDeleteModal');
  const confirmDeleteModal = new bootstrap.Modal(confirmDeleteModalEl);
  const confirmDeleteBtn = document.getElementById('confirmDelete');

  const importChoiceModalEl = document.getElementById('importChoiceModal');
  const importChoiceModal = new bootstrap.Modal(importChoiceModalEl);
  const importReplaceBtn = document.getElementById('importReplaceBtn');
  const importMergeBtn = document.getElementById('importMergeBtn');

  // Chart contexts
  const categoryCanvas = document.getElementById('categoryChart');
  const monthlyCanvas = document.getElementById('monthlyChart');
  const categoryNoData = document.getElementById('categoryNoData');
  const monthlyNoData = document.getElementById('monthlyNoData');

  let categoryChart = null;
  let monthlyChart = null;

  let pendingDeleteId = null;
  let importFileData = null; // holds parsed file until user chooses replace/merge

  /* --------- Storage CRUD --------- */
  function loadAll() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    try {
      return JSON.parse(raw);
    } catch (e) {
      console.error('Error reading storage, resetting', e);
      localStorage.removeItem(STORAGE_KEY);
      return [];
    }
  }
  function saveAll(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  function createPurchase(data) {
    const all = loadAll();
    const it = {
      id: uid(),
      name: data.name,
      amount: Number(parseFloat(data.amount) || 0),
      date: data.date,
      category: data.category || '',
      notes: data.notes || '',
      recurring: !!data.recurring,
      createdAt: Date.now()
    };
    all.push(it);
    saveAll(all);
    renderAll();
    showToast('Purchase added', { type: 'success' });
    return it;
  }

  function readPurchase(id) {
    const all = loadAll();
    return all.find(p => p.id === id) || null;
  }

  function updatePurchase(id, data) {
    const all = loadAll();
    const idx = all.findIndex(p => p.id === id);
    if (idx === -1) return null;
    all[idx] = {
      ...all[idx],
      name: data.name,
      amount: Number(parseFloat(data.amount) || 0),
      date: data.date,
      category: data.category || '',
      notes: data.notes || '',
      recurring: !!data.recurring
    };
    saveAll(all);
    renderAll();
    showToast('Purchase updated', { type: 'info' });
    return all[idx];
  }

  function deletePurchase(id) {
    let all = loadAll();
    const before = all.length;
    all = all.filter(p => p.id !== id);
    if (all.length !== before) {
      saveAll(all);
      renderAll();
      showToast('Purchase deleted', { type: 'warning' });
      return true;
    }
    return false;
  }

  /* --------- Filters & sorting --------- */
  function getFilters() {
    return {
      q: (searchText.value || '').trim().toLowerCase(),
      category: (filterCategory.value || '').trim().toLowerCase(),
      from: fromDate.value || null,
      to: toDate.value || null,
      sort: sortBy.value || 'date_desc'
    };
  }

  function matchesFilter(p, f) {
    if (f.q) {
      const hay = (p.name + ' ' + p.notes + ' ' + p.category).toLowerCase();
      if (!hay.includes(f.q)) return false;
    }
    if (f.category) {
      if (!p.category.toLowerCase().includes(f.category)) return false;
    }
    if (f.from) {
      if (p.date < f.from) return false;
    }
    if (f.to) {
      if (p.date > f.to) return false;
    }
    return true;
  }

  function sortList(list, sortKey) {
    const copy = [...list];
    switch (sortKey) {
      case 'date_asc': copy.sort((a,b) => a.date.localeCompare(b.date)); break;
      case 'date_desc': copy.sort((a,b) => b.date.localeCompare(a.date)); break;
      case 'amount_asc': copy.sort((a,b) => a.amount - b.amount); break;
      case 'amount_desc': copy.sort((a,b) => b.amount - a.amount); break;
      default: copy.sort((a,b) => b.date.localeCompare(a.date)); break;
    }
    return copy;
  }

  /* --------- Rendering --------- */
  function renderAll() {
    renderList();
    renderCharts();
  }

  // Table (desktop)
  function renderList() {
    const all = loadAll();
    const f = getFilters();
    const filtered = all.filter(p => matchesFilter(p, f));
    const sorted = sortList(filtered, f.sort);

    // Summary
    const total = filtered.reduce((s, p) => s + (Number(p.amount) || 0), 0);
    summaryCount.textContent = `${filtered.length} purchase${filtered.length !== 1 ? 's' : ''}`;
    summaryTotal.textContent = `Total ${fmtMoney(total)}`;

    // Table body
    purchasesTbody.innerHTML = '';
    for (const p of sorted) {
      const tr = document.createElement('tr');

      // Item cell
      const itemTd = document.createElement('td');
      const titleDiv = document.createElement('div');
      titleDiv.className = 'fw-semibold';
      titleDiv.textContent = p.name;
      const notesDiv = document.createElement('div');
      notesDiv.className = 'muted-note';
      notesDiv.textContent = p.notes || '';
      itemTd.appendChild(titleDiv);
      itemTd.appendChild(notesDiv);
      tr.appendChild(itemTd);

      // Amount
      const amountTd = document.createElement('td');
      amountTd.className = 'text-end fw-semibold';
      amountTd.textContent = fmtMoney(p.amount);
      tr.appendChild(amountTd);

      // Date
      const dateTd = document.createElement('td');
      dateTd.textContent = p.date;
      tr.appendChild(dateTd);

      // Category
      const catTd = document.createElement('td');
      catTd.textContent = p.category || '—';
      tr.appendChild(catTd);

      // Actions
      const actionsTd = document.createElement('td');
      actionsTd.className = 'text-end';
      const btnGroup = document.createElement('div');
      btnGroup.className = 'btn-group';
      const viewBtn = document.createElement('button');
      viewBtn.type = 'button';
      viewBtn.className = 'btn btn-sm btn-outline-secondary';
      viewBtn.title = 'View';
      viewBtn.ariaLabel = 'View purchase';
      viewBtn.innerHTML = '<i class="bi bi-eye"></i>';
      viewBtn.addEventListener('click', () => openViewModal(p.id));
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'btn btn-sm btn-outline-primary';
      editBtn.title = 'Edit';
      editBtn.ariaLabel = 'Edit purchase';
      editBtn.innerHTML = '<i class="bi bi-pencil"></i>';
      editBtn.addEventListener('click', () => openEditModal(p.id));
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn btn-sm btn-outline-danger';
      delBtn.title = 'Delete';
      delBtn.ariaLabel = 'Delete purchase';
      delBtn.innerHTML = '<i class="bi bi-trash"></i>';
      delBtn.addEventListener('click', () => {
        pendingDeleteId = p.id;
        confirmDeleteModal.show();
      });

      btnGroup.appendChild(viewBtn);
      btnGroup.appendChild(editBtn);
      btnGroup.appendChild(delBtn);
      actionsTd.appendChild(btnGroup);
      tr.appendChild(actionsTd);

      purchasesTbody.appendChild(tr);
    }

    // Cards (mobile)
    purchasesCards.innerHTML = '';
    for (const p of sorted) {
      const card = document.createElement('div');
      card.className = 'card p-3 purchase-card card-hover';

      const row = document.createElement('div');
      row.className = 'd-flex justify-content-between align-items-start';

      const left = document.createElement('div');
      left.style.flex = '1 1 auto';
      const title = document.createElement('div');
      title.className = 'fw-semibold';
      title.textContent = p.name;
      const notes = document.createElement('div');
      notes.className = 'muted-note';
      notes.textContent = p.notes || '';
      left.appendChild(title);
      left.appendChild(notes);

      const right = document.createElement('div');
      right.style.textAlign = 'right';
      const amt = document.createElement('div');
      amt.className = 'fw-semibold';
      amt.textContent = fmtMoney(p.amount);
      const dt = document.createElement('div');
      dt.className = 'muted-note';
      dt.textContent = p.date;
      right.appendChild(amt);
      right.appendChild(dt);

      row.appendChild(left);
      row.appendChild(right);

      // Category and actions
      const bottom = document.createElement('div');
      bottom.className = 'd-flex justify-content-between align-items-center card-actions mt-2';
      const catSpan = document.createElement('span');
      catSpan.className = 'badge bg-light text-dark';
      catSpan.textContent = p.category || '—';

      const actions = document.createElement('div');
      actions.className = 'action-btns';

      const viewBtnM = document.createElement('button');
      viewBtnM.type = 'button'; viewBtnM.className = 'btn btn-sm btn-outline-secondary'; viewBtnM.title='View';
      viewBtnM.innerHTML = '<i class="bi bi-eye"></i>';
      viewBtnM.addEventListener('click', () => openViewModal(p.id));

      const editBtnM = document.createElement('button');
      editBtnM.type = 'button'; editBtnM.className = 'btn btn-sm btn-outline-primary'; editBtnM.title='Edit';
      editBtnM.innerHTML = '<i class="bi bi-pencil"></i>';
      editBtnM.addEventListener('click', () => openEditModal(p.id));

      const delBtnM = document.createElement('button');
      delBtnM.type = 'button'; delBtnM.className = 'btn btn-sm btn-outline-danger'; delBtnM.title='Delete';
      delBtnM.innerHTML = '<i class="bi bi-trash"></i>';
      delBtnM.addEventListener('click', () => {
        pendingDeleteId = p.id;
        confirmDeleteModal.show();
      });

      actions.appendChild(viewBtnM);
      actions.appendChild(editBtnM);
      actions.appendChild(delBtnM);

      bottom.appendChild(catSpan);
      bottom.appendChild(actions);

      card.appendChild(row);
      card.appendChild(bottom);
      purchasesCards.appendChild(card);
    }
  }

  /* --------- Charts --------- */
  function renderCharts() {
    const all = loadAll();
    const f = getFilters();
    const filtered = all.filter(p => matchesFilter(p, f));

    // Category breakdown
    const catMap = new Map();
    for (const p of filtered) {
      const c = (p.category || 'Uncategorized').trim();
      catMap.set(c, (catMap.get(c) || 0) + (Number(p.amount) || 0));
    }
    const catLabels = Array.from(catMap.keys());
    const catValues = Array.from(catMap.values());

    if (catValues.length === 0) {
      categoryCanvas.style.display = 'none';
      categoryNoData.classList.remove('d-none');
    } else {
      categoryCanvas.style.display = '';
      categoryNoData.classList.add('d-none');
      const colors = generatePalette(catLabels.length);
      if (categoryChart) {
        categoryChart.data.labels = catLabels;
        categoryChart.data.datasets[0].data = catValues;
        categoryChart.data.datasets[0].backgroundColor = colors;
        categoryChart.update();
      } else {
        categoryChart = new Chart(categoryCanvas, {
          type: 'doughnut',
          data: {
            labels: catLabels,
            datasets: [{
              data: catValues,
              backgroundColor: colors,
              borderWidth: 0
            }]
          },
          options: {
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } },
            maintainAspectRatio: false
          }
        });
      }
    }

    // Monthly spend - last 12 months
    const monthMap = new Map();
    const now = new Date();
    // prepare last 12 months labels (YYYY-MM)
    const months = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = d.toISOString().slice(0,7); // YYYY-MM
      months.push({ key, label: d.toLocaleString(undefined, { month: 'short', year: 'numeric' }) });
      monthMap.set(key, 0);
    }
    for (const p of filtered) {
      if (!p.date) continue;
      const key = p.date.slice(0,7);
      if (monthMap.has(key)) monthMap.set(key, monthMap.get(key) + (Number(p.amount) || 0));
    }
    const monthLabels = months.map(m => m.label);
    const monthValues = months.map(m => monthMap.get(m.key) || 0);

    const anyMonthData = monthValues.some(v => v > 0);
    if (!anyMonthData) {
      monthlyCanvas.style.display = 'none';
      monthlyNoData.classList.remove('d-none');
    } else {
      monthlyCanvas.style.display = '';
      monthlyNoData.classList.add('d-none');
      if (monthlyChart) {
        monthlyChart.data.labels = monthLabels;
        monthlyChart.data.datasets[0].data = monthValues;
        monthlyChart.update();
      } else {
        monthlyChart = new Chart(monthlyCanvas, {
          type: 'line',
          data: {
            labels: monthLabels,
            datasets: [{
              label: 'Spend',
              data: monthValues,
              borderColor: '#0d6efd',
              backgroundColor: 'rgba(13,110,253,0.08)',
              tension: 0.3,
              fill: true,
              pointRadius: 3
            }]
          },
          options: {
            plugins: { legend: { display: false } },
            scales: {
              y: { ticks: { callback: (v) => currencyFormatter.format(v) } }
            },
            maintainAspectRatio: false
          }
        });
      }
    }
  }

  function generatePalette(n) {
    const base = [
      '#0d6efd','#6610f2','#6f42c1','#d63384','#dc3545','#fd7e14','#ffc107','#198754','#20c997','#0dcaf0','#6c757d'
    ];
    const out = [];
    for (let i=0;i<n;i++) out.push(base[i % base.length]);
    return out;
  }

  /* --------- Modal actions --------- */
  function openEditModal(id = null) {
    if (id) {
      const p = readPurchase(id);
      if (!p) return showToast('Purchase not found', { type: 'danger' });
      modalTitle.textContent = 'Edit Purchase';
      purchaseId.value = p.id;
      nameInput.value = p.name;
      amountInput.value = p.amount;
      dateInput.value = p.date;
      categoryInput.value = p.category;
      notesInput.value = p.notes;
      recurringInput.checked = !!p.recurring;
    } else {
      modalTitle.textContent = 'Add Purchase';
      purchaseId.value = '';
      purchaseForm.reset();
      dateInput.value = new Date().toISOString().slice(0,10);
    }
    purchaseForm.classList.remove('was-validated');
    purchaseModal.show();
  }

  function openViewModal(id) {
    const p = readPurchase(id);
    if (!p) return showToast('Purchase not found', { type: 'danger' });
    modalTitle.textContent = 'View Purchase';
    purchaseId.value = p.id;
    nameInput.value = p.name;
    amountInput.value = p.amount;
    dateInput.value = p.date;
    categoryInput.value = p.category;
    notesInput.value = p.notes;
    recurringInput.checked = !!p.recurring;

    // disable form inputs for view
    Array.from(purchaseForm.elements).forEach(el => el.disabled = true);
    document.getElementById('saveBtn').style.display = 'none';
    purchaseModal.show();

    purchaseModalEl.addEventListener('hidden.bs.modal', () => {
      Array.from(purchaseForm.elements).forEach(el => el.disabled = false);
      document.getElementById('saveBtn').style.display = '';
      modalTitle.textContent = 'Add Purchase';
      purchaseForm.classList.remove('was-validated');
    }, { once: true });
  }

  /* --------- Form submit --------- */
  purchaseForm.addEventListener('submit', (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    purchaseForm.classList.add('was-validated');
    // Basic validity
    if (!purchaseForm.checkValidity()) return;
    const payload = {
      name: nameInput.value.trim(),
      amount: amountInput.value,
      date: dateInput.value,
      category: categoryInput.value.trim(),
      notes: notesInput.value.trim(),
      recurring: recurringInput.checked
    };
    if (purchaseId.value) {
      updatePurchase(purchaseId.value, payload);
    } else {
      createPurchase(payload);
    }
    purchaseModal.hide();
  });

  /* --------- Delete confirm --------- */
  confirmDeleteBtn.addEventListener('click', () => {
    if (!pendingDeleteId) return;
    deletePurchase(pendingDeleteId);
    pendingDeleteId = null;
    confirmDeleteModal.hide();
  });

  /* --------- Import / Export --------- */
  exportBtn.addEventListener('click', () => {
    const all = loadAll();
    const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'purchases.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Exported purchases', { type: 'success' });
  });

  importBtn.addEventListener('click', () => {
    // create file input
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { // 5MB limit
        return showToast('File too large (max 5MB)', { type: 'danger' });
      }
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (!Array.isArray(parsed)) throw new Error('Invalid file format (expected array)');
        // Basic validation and normalization
        const items = parsed.map((p) => ({
          id: p.id || uid(),
          name: String(p.name || 'Untitled'),
          amount: Number(parseFloat(p.amount) || 0),
          date: p.date || (new Date().toISOString().slice(0,10)),
          category: p.category || '',
          notes: p.notes || '',
          recurring: !!p.recurring,
          createdAt: p.createdAt || Date.now()
        }));
        importFileData = items;
        // show choice modal
        importChoiceModal.show();
      } catch (err) {
        console.error(err);
        showToast('Failed to import file: ' + (err.message || err), { type: 'danger' });
      }
    };
    input.click();
  });

  importReplaceBtn.addEventListener('click', () => {
    if (!importFileData) return;
    saveAll(importFileData);
    importFileData = null;
    importChoiceModal.hide();
    renderAll();
    showToast('Imported: replaced all purchases', { type: 'success' });
  });

  importMergeBtn.addEventListener('click', () => {
    if (!importFileData) return;
    const existing = loadAll();
    const map = new Map(existing.map(x => [x.id, x]));
    for (const it of importFileData) {
      if (!map.has(it.id)) existing.push(it);
      else {
        // keep both by generating new id
        it.id = uid();
        existing.push(it);
      }
    }
    saveAll(existing);
    importFileData = null;
    importChoiceModal.hide();
    renderAll();
    showToast('Imported: merged purchases', { type: 'success' });
  });

  /* --------- Filters / UI events --------- */
  clearFiltersBtn.addEventListener('click', () => {
    searchText.value = '';
    filterCategory.value = '';
    fromDate.value = '';
    toDate.value = '';
    sortBy.value = 'date_desc';
    renderAll();
  });

  const debouncedRender = debounce(() => renderAll(), 250);
  [searchText, filterCategory, fromDate, toDate, sortBy].forEach(el => {
    el.addEventListener('input', debouncedRender);
    el.addEventListener('change', debouncedRender);
  });

  addBtn.addEventListener('click', () => openEditModal());

  /* --------- Boot --------- */
  function boot() {
    // ensure no sample data: only create storage when saving
    renderAll();
  }

  boot();

  // Expose some helpers for debugging (optional)
  window.__purchaseTracker = {
    loadAll, saveAll, createPurchase, readPurchase, updatePurchase, deletePurchase, renderAll
  };

})();
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Purchase Tracker — SCRUD</title>

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Small custom tweaks */
    body { padding-bottom: 4rem; }
    .card-hover:hover { box-shadow: 0 6px 18px rgba(0,0,0,.08); transform: translateY(-2px); transition: .15s; }
    .small-muted { font-size: .9rem; color: #6c757d; }
    @media (max-width: 575.98px) {
      .table-responsive { font-size: .92rem; }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">Purchase Tracker</a>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary" id="importBtn">Import</button>
      <button class="btn btn-sm btn-outline-secondary" id="exportBtn">Export</button>
      <button class="btn btn-primary" id="addBtn">+ Add</button>
    </div>
  </div>
</nav>

<main class="container my-3">
  <div class="row g-3">
    <!-- Filters / Search -->
    <div class="col-12">
      <div class="card p-2 card-hover">
        <div class="row gx-2 gy-2 align-items-center">
          <div class="col-12 col-md-4">
            <input id="searchText" type="search" class="form-control" placeholder="Search name, notes, category...">
          </div>
          <div class="col-6 col-md-2">
            <input id="filterCategory" class="form-control" placeholder="Category">
          </div>
          <div class="col-6 col-md-2">
            <input id="fromDate" type="date" class="form-control" title="From date">
          </div>
          <div class="col-6 col-md-2">
            <input id="toDate" type="date" class="form-control" title="To date">
          </div>
          <div class="col-6 col-md-2 text-end">
            <button id="clearFilters" class="btn btn-outline-secondary">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Summary -->
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center small-muted">
        <div id="summaryText">0 purchases • total ₱0.00</div>
        <div>
          <select id="sortBy" class="form-select form-select-sm">
            <option value="date_desc">Sort: Newest</option>
            <option value="date_asc">Sort: Oldest</option>
            <option value="amount_desc">Sort: Amount (High→Low)</option>
            <option value="amount_asc">Sort: Amount (Low→High)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- List -->
    <div class="col-12">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light small-muted">
            <tr>
              <th style="width: 48%;">Item</th>
              <th class="text-end">Amount</th>
              <th style="width: 12%;">Date</th>
              <th style="width: 12%;">Category</th>
              <th style="width: 12%;">Actions</th>
            </tr>
          </thead>
          <tbody id="purchasesTbody"></tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<!-- Add / Edit Modal -->
<div class="modal fade" id="purchaseModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form id="purchaseForm" class="modal-content needs-validation" novalidate>
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Purchase</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input id="purchaseId" type="hidden">
        <div class="mb-2">
          <label class="form-label">Name</label>
          <input id="name" class="form-control" required>
          <div class="invalid-feedback">Name is required</div>
        </div>
        <div class="mb-2 row">
          <div class="col-6">
            <label class="form-label">Amount (₱)</label>
            <input id="amount" type="number" step="0.01" min="0" class="form-control" required>
            <div class="invalid-feedback">Enter a valid amount</div>
          </div>
          <div class="col-6">
            <label class="form-label">Date</label>
            <input id="date" type="date" class="form-control" required>
            <div class="invalid-feedback">Pick a date</div>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label">Category</label>
          <input id="category" class="form-control" placeholder="e.g., Groceries, Electronics">
        </div>
        <div class="mb-2">
          <label class="form-label">Notes (optional)</label>
          <textarea id="notes" class="form-control" rows="2"></textarea>
        </div>
        <div class="form-check form-switch">
          <input id="recurring" class="form-check-input" type="checkbox">
          <label class="form-check-label">Recurring</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm delete modal -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <p class="mb-0">Are you sure you want to delete this purchase?</p>
      </div>
      <div class="modal-footer">
        <button id="cancelDelete" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button id="confirmDelete" type="button" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS & dependencies (Popper included) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
/*
  Purchase Tracker v1
  - Stores purchases in localStorage under key 'purchaseTracker.v1'
  - Data model:
    {
      id: string,
      name: string,
      amount: number,
      date: 'YYYY-MM-DD',
      category: string,
      notes: string,
      recurring: boolean,
      createdAt: timestamp
    }
*/

(() => {
  // Config / storage key
  const STORAGE_KEY = 'purchaseTracker.v1';

  // DOM
  const purchasesTbody = document.getElementById('purchasesTbody');
  const summaryText = document.getElementById('summaryText');
  const searchText = document.getElementById('searchText');
  const filterCategory = document.getElementById('filterCategory');
  const fromDate = document.getElementById('fromDate');
  const toDate = document.getElementById('toDate');
  const sortBy = document.getElementById('sortBy');
  const clearFiltersBtn = document.getElementById('clearFilters');
  const addBtn = document.getElementById('addBtn');
  const purchaseModalEl = document.getElementById('purchaseModal');
  const purchaseModal = new bootstrap.Modal(purchaseModalEl);
  const purchaseForm = document.getElementById('purchaseForm');
  const modalTitle = document.getElementById('modalTitle');
  const purchaseId = document.getElementById('purchaseId');
  const nameInput = document.getElementById('name');
  const amountInput = document.getElementById('amount');
  const dateInput = document.getElementById('date');
  const categoryInput = document.getElementById('category');
  const notesInput = document.getElementById('notes');
  const recurringInput = document.getElementById('recurring');
  const importBtn = document.getElementById('importBtn');
  const exportBtn = document.getElementById('exportBtn');

  const confirmDeleteModalEl = document.getElementById('confirmDeleteModal');
  const confirmDeleteModal = new bootstrap.Modal(confirmDeleteModalEl);
  const confirmDeleteBtn = document.getElementById('confirmDelete');
  let pendingDeleteId = null;

  // Utilities
  const uid = () => Math.random().toString(36).slice(2, 9);
  const fmtMoney = n => {
    if (isNaN(n)) return '₱0.00';
    return n.toLocaleString(undefined, { style: 'currency', currency: 'PHP', minimumFractionDigits: 2 });
  };

  // Load/save
  function loadAll() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // seed with a few examples
      const seed = [
        { id: uid(), name: 'Groceries at Market', amount: 1250.50, date: todayOffset(-5), category: 'Groceries', notes: 'Weekly shop', recurring: false, createdAt: Date.now() - 1000000 },
        { id: uid(), name: 'Coffee', amount: 150, date: todayOffset(-1), category: 'Food', notes: 'Coffee with friend', recurring: false, createdAt: Date.now() - 900000 },
        { id: uid(), name: 'Phone bill', amount: 899.99, date: todayOffset(-20), category: 'Bills', notes: 'Monthly mobile plan', recurring: true, createdAt: Date.now() - 800000 }
      ];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
      return seed;
    }
    try {
      return JSON.parse(raw);
    } catch (e) {
      console.error('Invalid data in storage, resetting', e);
      localStorage.removeItem(STORAGE_KEY);
      return [];
    }
  }
  function saveAll(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  function todayOffset(offsetDays = 0) {
    const d = new Date();
    d.setDate(d.getDate() + offsetDays);
    return d.toISOString().slice(0,10);
  }

  // CRUD operations
  function createPurchase(data) {
    const all = loadAll();
    const item = {
      id: uid(),
      name: data.name,
      amount: Number(parseFloat(data.amount) || 0),
      date: data.date,
      category: data.category || '',
      notes: data.notes || '',
      recurring: !!data.recurring,
      createdAt: Date.now()
    };
    all.push(item);
    saveAll(all);
    renderList();
    return item;
  }

  function readPurchase(id) {
    const all = loadAll();
    return all.find(p => p.id === id) || null;
  }

  function updatePurchase(id, data) {
    const all = loadAll();
    const idx = all.findIndex(p => p.id === id);
    if (idx === -1) return null;
    all[idx] = {
      ...all[idx],
      name: data.name,
      amount: Number(parseFloat(data.amount) || 0),
      date: data.date,
      category: data.category || '',
      notes: data.notes || '',
      recurring: !!data.recurring
    };
    saveAll(all);
    renderList();
    return all[idx];
  }

  function deletePurchase(id) {
    let all = loadAll();
    const before = all.length;
    all = all.filter(p => p.id !== id);
    if (all.length !== before) {
      saveAll(all);
      renderList();
      return true;
    }
    return false;
  }

  // Rendering & filtering
  function getFilters() {
    return {
      q: (searchText.value || '').trim().toLowerCase(),
      category: (filterCategory.value || '').trim().toLowerCase(),
      from: fromDate.value || null,
      to: toDate.value || null,
      sort: sortBy.value
    };
  }

  function matchesFilter(p, f) {
    // text match
    if (f.q) {
      const hay = (p.name + ' ' + p.notes + ' ' + p.category).toLowerCase();
      if (!hay.includes(f.q)) return false;
    }
    if (f.category) {
      if (!p.category.toLowerCase().includes(f.category)) return false;
    }
    if (f.from) {
      if (p.date < f.from) return false;
    }
    if (f.to) {
      if (p.date > f.to) return false;
    }
    return true;
  }

  function sortList(list, sortKey) {
    const copy = [...list];
    switch (sortKey) {
      case 'date_asc': copy.sort((a,b) => a.date.localeCompare(b.date)); break;
      case 'date_desc': copy.sort((a,b) => b.date.localeCompare(a.date)); break;
      case 'amount_asc': copy.sort((a,b) => a.amount - b.amount); break;
      case 'amount_desc': copy.sort((a,b) => b.amount - a.amount); break;
      default: copy.sort((a,b) => b.date.localeCompare(a.date)); break;
    }
    return copy;
  }

  function renderList() {
    const all = loadAll();
    const f = getFilters();
    const filtered = all.filter(p => matchesFilter(p,f));
    const sorted = sortList(filtered, f.sort);
    purchasesTbody.innerHTML = '';
    let total = 0;
    for (const p of sorted) {
      total += p.amount || 0;
      const tr = document.createElement('tr');

      // Item cell
      const itemTd = document.createElement('td');
      itemTd.innerHTML = `<div class="fw-semibold">${escapeHtml(p.name)}</div>
                          <div class="small-muted">${escapeHtml(p.notes || '')}</div>`;
      tr.appendChild(itemTd);

      // Amount
      const amountTd = document.createElement('td');
      amountTd.className = 'text-end fw-semibold';
      amountTd.textContent = fmtMoney(p.amount);
      tr.appendChild(amountTd);

      // Date
      const dateTd = document.createElement('td');
      dateTd.textContent = p.date;
      tr.appendChild(dateTd);

      // Category
      const catTd = document.createElement('td');
      catTd.textContent = p.category || '—';
      tr.appendChild(catTd);

      // Actions
      const actionsTd = document.createElement('td');
      actionsTd.className = 'text-end';
      actionsTd.innerHTML = `
        <div class="btn-group" role="group" aria-label="Actions">
          <button class="btn btn-sm btn-outline-secondary me-1 view-btn" data-id="${p.id}" title="View">View</button>
          <button class="btn btn-sm btn-outline-primary me-1 edit-btn" data-id="${p.id}" title="Edit">Edit</button>
          <button class="btn btn-sm btn-outline-danger del-btn" data-id="${p.id}" title="Delete">Delete</button>
        </div>`;
      tr.appendChild(actionsTd);

      purchasesTbody.appendChild(tr);
    }

    // summary
    summaryText.textContent = `${filtered.length} purchases • total ${fmtMoney(total)}`;
    attachRowHandlers();
  }

  function attachRowHandlers() {
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.onclick = (e) => {
        const id = btn.getAttribute('data-id');
        openEditModal(id);
      };
    });
    document.querySelectorAll('.del-btn').forEach(btn => {
      btn.onclick = (e) => {
        pendingDeleteId = btn.getAttribute('data-id');
        confirmDeleteModal.show();
      };
    });
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.onclick = (e) => {
        const id = btn.getAttribute('data-id');
        openViewModal(id);
      };
    });
  }

  function openViewModal(id) {
    const p = readPurchase(id);
    if (!p) return alert('Not found');
    // Use the same modal but make read-only preview
    modalTitle.textContent = 'View Purchase';
    purchaseId.value = p.id;
    nameInput.value = p.name;
    amountInput.value = p.amount;
    dateInput.value = p.date;
    categoryInput.value = p.category;
    notesInput.value = p.notes;
    recurringInput.checked = !!p.recurring;

    // disable form fields temporarily
    Array.from(purchaseForm.elements).forEach(el => el.disabled = true);
    // show modal, but keep Save hidden; we'll show Cancel only
    document.getElementById('saveBtn').style.display = 'none';
    purchaseModal.show();

    // When modal hidden restore
    purchaseModalEl.addEventListener('hidden.bs.modal', () => {
      Array.from(purchaseForm.elements).forEach(el => el.disabled = false);
      document.getElementById('saveBtn').style.display = '';
      modalTitle.textContent = 'Add Purchase';
      purchaseForm.classList.remove('was-validated');
      // cleanup listener once
    }, { once: true });
  }

  function openEditModal(id = null) {
    if (id) {
      const p = readPurchase(id);
      if (!p) return alert('Not found');
      modalTitle.textContent = 'Edit Purchase';
      purchaseId.value = p.id;
      nameInput.value = p.name;
      amountInput.value = p.amount;
      dateInput.value = p.date;
      categoryInput.value = p.category;
      notesInput.value = p.notes;
      recurringInput.checked = !!p.recurring;
    } else {
      modalTitle.textContent = 'Add Purchase';
      purchaseId.value = '';
      purchaseForm.reset();
      // default date: today
      dateInput.value = todayOffset(0);
    }
    purchaseForm.classList.remove('was-validated');
    purchaseModal.show();
  }

  // Form submit (create or update)
  purchaseForm.addEventListener('submit', (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    purchaseForm.classList.add('was-validated');
    if (!purchaseForm.checkValidity()) {
      return;
    }
    const payload = {
      name: nameInput.value.trim(),
      amount: amountInput.value,
      date: dateInput.value,
      category: categoryInput.value.trim(),
      notes: notesInput.value.trim(),
      recurring: recurringInput.checked
    };
    if (purchaseId.value) {
      updatePurchase(purchaseId.value, payload);
    } else {
      createPurchase(payload);
    }
    purchaseModal.hide();
  });

  // Delete confirm
  confirmDeleteBtn.addEventListener('click', () => {
    if (!pendingDeleteId) return;
    deletePurchase(pendingDeleteId);
    pendingDeleteId = null;
    confirmDeleteModal.hide();
  });

  // Buttons & filters
  addBtn.addEventListener('click', () => openEditModal());
  clearFiltersBtn.addEventListener('click', () => {
    searchText.value = '';
    filterCategory.value = '';
    fromDate.value = '';
    toDate.value = '';
    sortBy.value = 'date_desc';
    renderList();
  });

  [searchText, filterCategory, fromDate, toDate, sortBy].forEach(el => {
    el.addEventListener('input', () => renderList());
    el.addEventListener('change', () => renderList());
  });

  // Import / Export
  exportBtn.addEventListener('click', () => {
    const all = loadAll();
    const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'purchases.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', async () => {
    // create file input on the fly
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (!Array.isArray(parsed)) throw new Error('Invalid file format');
        // basic validation of items
        const items = parsed.map((p) => ({
          id: p.id || uid(),
          name: String(p.name || 'Untitled'),
          amount: Number(parseFloat(p.amount) || 0),
          date: p.date || todayOffset(0),
          category: p.category || '',
          notes: p.notes || '',
          recurring: !!p.recurring,
          createdAt: p.createdAt || Date.now()
        }));
        // prompt: merge or replace
        if (confirm('Replace all purchases with imported file? Press Cancel to MERGE with existing.')) {
          saveAll(items);
        } else {
          const existing = loadAll();
          // avoid id collision
          const map = new Map(existing.map(x => [x.id, x]));
          for (const it of items) {
            if (!map.has(it.id)) existing.push(it);
            else {
              // if same id, generate a new id to keep both
              it.id = uid();
              existing.push(it);
            }
          }
          saveAll(existing);
        }
        renderList();
        alert('Import successful');
      } catch (err) {
        console.error(err);
        alert('Failed to import: ' + (err.message || err));
      }
    };
    input.click();
  });

  // Simple escape to prevent XSS in inserted text
  function escapeHtml(s) {
    if (!s) return '';
    return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  }

  // Boot: render
  renderList();

  // Expose debug to window (convenience)
  window.__purchaseTracker = {
    loadAll, saveAll, createPurchase, readPurchase, updatePurchase, deletePurchase
  };

})();
</script>

</body>
</html>
